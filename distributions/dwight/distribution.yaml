name: dwight
version: 0.1.3
description: "Agent Hermes SEO/GEO client-safe avec Claude SEO v2.2.4, contenu, recherche et opérations WordPress"
hermes_requires: ">=0.12.0"
author: "Wander Labs"
license: "Proprietary"

env_requires:
  - name: PERPLEXITY_API_KEY
    description: "Clé API Perplexity pour les recherches Sonar"
    required: false
  - name: DATAFORSEO_LOGIN
    description: "Identifiant API DataForSEO"
    required: false
  - name: DATAFORSEO_PASSWORD
    description: "Mot de passe API DataForSEO"
    required: false
  - name: CLIENT_WORDPRESS_URL
    description: "URL du site WordPress du client"
    required: false
  - name: CLIENT_WORDPRESS_USER
    description: "Utilisateur WordPress dédié à Dwight"
    required: false
  - name: CLIENT_WORDPRESS_APP_PASSWORD
    description: "Application Password WordPress dédié à Dwight"
    required: false

distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
  - skills/dwight-seo-core/
  - skills/dwight-research-core/
  - skills/dwight-seo-market-intelligence/
  - skills/dwight-seo-performance-audit/
  - skills/dwight-seo-silo-strategy/
  - skills/dwight-seo-content-production/
  - skills/dwight-seo-internal-linking/
  - skills/dwight-wordpress-safe-operations/
  - skills/dwight-brand-voice-extraction/
  - skills/dwight-claude-seo/
  - skills/dwight-claude-seo-fanout/
  - skills/dwight-claude-seo-agents/
  - skills/claude-seo-upstream/
